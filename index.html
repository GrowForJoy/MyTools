<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <header class="site-header">
    <div class="header-inner">

      <nav class="header-nav">
        <button class="icon-btn" id="themeToggle" aria-label="切换深色 / 浅色模式" title="切换主题">
          <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>

  <main>
    <section class="hero">

      <p>一个正在成长的小工具集合。所有工具都在你的浏览器本地运行，图片等文件不会上传到任何服务器。</p>
    </section>

    <section class="tool-grid" aria-label="工具列表">
      <a class="tool-card" href="tools/image-compress.html">
        <div class="icon icon-orange" aria-hidden="true">

            <path d="M21 15l-5-5L5 21"/>

        <p>按目标大小或质量压缩图片，支持 JPEG / WebP / PNG，全程本地处理。</p>
        <span class="tool-tag">已上线</span>
        <span class="go" aria-hidden="true">→</span>

      <a class="tool-card" href="tools/image-format-convert.html">
        <div class="icon icon-teal" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3L4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/>

        <p>在 JPEG、WebP、PNG 之间互相转换，支持调节质量，全程本地处理。</p>

        </div>
        <h3>更多工具</h3>
        <p>更多实用小工具正在路上，敬请期待。</p>
        <span class="tool-tag tag-muted">即将上线</span>

  <footer class="site-footer">
